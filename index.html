<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>teracoffee</title>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f8fafc;">
        <img src="/tera.png" alt="테라커피 로고" style="width: 120px; height: auto; animation: pulse 1.5s infinite;" />
        <p style="margin-top: 24px; color: #d97706; font-weight: bold; font-family: sans-serif; font-size: 1.1rem;">
          재고 앱을 불러오는 중...
        </p>
      </div>
      <style>
        @keyframes pulse {
          0% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: 0.7; }
          100% { transform: scale(1); opacity: 1; }
        }
      </style></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
